<style>
  :root{
    --bg:#0a0e12;--panel:#10161d;--line:#1f2a33;--fg:#d7e0e6;--muted:#8294a0;--faint:#5a6a74;
    --amber:#e8a13a;--cyan:#43c0b8;--cyan-dim:#1f4f4c;--crit:#e05c5c;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);
    display:flex;align-items:center;justify-content:center;

  .box{max-width:560px;width:100%;text-align:center}
  .code{font-family:var(--mono);font-size:clamp(3rem,16vw,6rem);font-weight:700;letter-spacing:.04em;color:var(--crit);line-height:1;margin:0}
  .code .ok{color:var(--amber)}
  h1{font-family:var(--mono);font-size:1.05rem;color:var(--cyan);margin:.6rem 0 0;letter-spacing:.02em}
  p{color:var(--muted);font-size:.9rem;margin:.6rem 0 0}
  .hex{font-family:var(--mono);font-size:.74rem;color:var(--faint);margin:14px 0 0;white-space:pre;overflow-x:auto}
  nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:22px}
  nav a{font-family:var(--mono);font-size:.78rem;color:var(--fg);text-decoration:none;padding:8px 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
  nav a:hover{border-color:var(--cyan-dim);color:var(--cyan)}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
